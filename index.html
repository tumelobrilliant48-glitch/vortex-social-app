<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#00d4ff">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Outfit:wght@400;600&family=Material+Icons" rel="stylesheet">
<title>VORTEX - Neon by Brilliant</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif}
body{background:#020a14;color:#fff;overflow-x:hidden;padding-bottom:90px}
@keyframes glowPulse{0%,100%{box-shadow:0 0 15px #00d4ff,0 0 30px #00d4ff40, inset 0 0 10px #00d4ff20}50%{box-shadow:0 0 25px #00d4ff,0 0 50px #00d4ff60, inset 0 0 15px #00d4ff30}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:#020a14;border-bottom:1px solid #00d4ff30;position:sticky;top:0;z-index:100}
.logo-wrap{display:flex;align-items:center;gap:10px}
.v-circle{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle,#0a2a4a,#020a14);border:2px solid #00d4ff;display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-weight:800;font-size:22px;color:#00d4ff;box-shadow:0 0 20px #00d4ff, inset 0 0 10px #00d4ff60;animation:glowPulse 2s infinite}
.brand{font-family:'Orbitron';font-weight:800;font-size:20px;letter-spacing:3px;color:#00d4ff;text-shadow:0 0 10px #00d4ff}
.brand small{display:block;font-size:7px;letter-spacing:4px;color:#00d4ff99;font-family:'Outfit'}
.hero{margin:16px;border:1px solid #00d4ff60;border-radius:20px;padding:14px;display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#051425,#0a2342);box-shadow:0 0 25px #00d4ff30, inset 0 0 15px #00d4ff15;animation:glowPulse 3s infinite}
.hero .v-big{width:68px;height:68px;border-radius:50%;border:2px solid #00d4ff;background:radial-gradient(circle,#0a2a4a,#020a14);display:flex;align-items:center;justify-content:center;font-family:'Orbitron';font-size:28px;font-weight:800;color:#00d4ff;box-shadow:0 0 25px #00d4ff}
.stories{display:flex;gap:16px;overflow-x:auto;padding:14px 16px;scrollbar-width:none}
.stories::-webkit-scrollbar{display:none}
.story{min-width:70px;text-align:center}
.story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:linear-gradient(45deg,#00d4ff,#00ffea);box-shadow:0 0 15px #00d4ff80}
.story-inner{width:100%;height:100%;border-radius:50%;background:#020a14;border:2px solid #020a14;display:flex;align-items:center;justify-content:center;overflow:hidden}
.story span{font-size:11px;margin-top:6px;display:block;color:#8bb4cc}
.composer{margin:14px 16px;border:1.5px solid #00d4ff70;border-radius:22px;padding:14px;background:rgba(2,20,40,0.8);box-shadow:0 0 20px #00d4ff30, inset 0 0 10px #00d4ff10}
.input-row{display:flex;gap:10px;align-items:center}
.input-row .v-small{width:42px;height:42px;border-radius:50%;border:1.5px solid #00d4ff;display:flex;align-items:center;justify-content:center;color:#00d4ff;font-family:'Orbitron';font-weight:800;box-shadow:0 0 12px #00d4ff60}
.input{flex:1;background:#051a30;border:1px solid #00d4ff40;border-radius:14px;padding:12px 14px;color:#fff;outline:none}
.input::placeholder{color:#5a8aa8}
.actions-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.btn-ghost{color:#8bb4cc;font-size:13px;display:flex;align-items:center;gap:6px}
.btn-share{background:linear-gradient(90deg,#00d4ff,#00aaff);border:none;padding:10px 20px;border-radius:999px;color:#00111f;font-weight:700;box-shadow:0 0 15px #00d4ff;cursor:pointer}
.tabs{display:flex;margin:16px;background:#051a30;border-radius:999px;padding:4px;border:1px solid #00d4ff30}
.tab{flex:1;text-align:center;padding:10px;border-radius:999px;font-size:14px;font-weight:600;cursor:pointer}
.tab.active{background:#00d4ff;color:#00111f;box-shadow:0 0 15px #00d4ff}
.post{margin:12px 16px;border:1.5px solid #00d4ff50;border-radius:18px;padding:14px;background:rgba(5,26,48,0.7);box-shadow:0 0 15px #00d4ff20}
.post-head{display:flex;justify-content:space-between;align-items:center}
.post-actions{display:flex;gap:18px;margin-top:12px;color:#6b9bb5}
.bottom{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(180deg,#020a14,#001a33);border-top:1px solid #00d4ff40;display:flex;justify-content:space-around;padding:10px 0 18px;z-index:100;box-shadow:0 -5px 20px #00d4ff20}
.nav{color:#4a7a99;display:flex;flex-direction:column;align-items:center;font-size:11px;gap:2px}
.nav.active{color:#00d4ff;text-shadow:0 0 8px #00d4ff}
.nav .plus{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle,#00d4ff,#0088ff);display:flex;align-items:center;justify-content:center;color:#00111f;font-size:28px;box-shadow:0 0 25px #00d4ff, inset 0 0 10px #ffffff80;margin-top:-20px}
.monetize{margin:12px 16px;border:1px dashed #00d4ff80;border-radius:16px;padding:12px;text-align:center;background:#051a30;color:#00d4ff;font-size:12px;box-shadow:0 0 10px #00d4ff20}
</style>
</head>
<body>
<div class="top">
<div class="logo-wrap"><div class="v-circle">V</div><div class="brand">VERTEX <small>CONNECT • SHARE • GROW</small></div></div>
<div style="display:flex;gap:14px;color:#00d4ff"><i class="material-icons">search</i><i class="material-icons">chat_bubble_outline</i><i class="material-icons">notifications_none</i></div>
</div>

<div class="hero">
<div class="v-big">V</div>
<div><div style="font-family:'Orbitron';font-weight:800;font-size:18px;letter-spacing:1px">VERTEX</div><div style="font-size:12px;color:#8bb4cc">By Brilliant mere <span style="color:#00d4ff">✔</span><br>Ideas • People • Endless Possibilities</div></div>
